[project]
name = "railpoint-ai"
version = "0.1.0"
description = "AI-Based Failure Detection and Prediction for Railway Point Switch Machines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harishik Dev Singh Jamwal", email = "singhharishikdev@gmail.com" }]

dependencies = [
    # NumPy 2 is the default, but the Intel-Mac ceiling of torch 2.2.x was
    # compiled against NumPy 1.x - mixing them leaves torch unable to convert
    # arrays at all ("_ARRAY_API not found"), which breaks silently at runtime
    # rather than at install time.
    "numpy>=1.26,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.0,<3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # scipy >=1.14 is built against NumPy 2 and uses np.long, which does not
    # exist in NumPy 1.x. Kept in step with the numpy pin above.
    "scipy>=1.11,<1.14 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scipy>=1.14,<2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas>=2.2,<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas>=2.2,<3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pyarrow>=17",
    "scikit-learn>=1.5,<1.7 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scikit-learn>=1.5,<2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "xgboost>=2.1,<4",
    "PyWavelets>=1.7,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.12,<1",
    "rich>=13",
]

[project.optional-dependencies]
ml = [
    # PyTorch dropped macOS x86_64 wheels after 2.2.x; 2.13 ships only
    # macosx_14_0_arm64. This project is developed on an Intel Mac, so the
    # ceiling is pinned rather than silently failing to install there.
    "torch>=2.2,<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.4 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "shap>=0.46",
    "mlflow>=2.16",
    "matplotlib>=3.9",
]
# The backend imports fastapi and the Dockerfile/Makefile invoke uvicorn, but
# neither was declared anywhere: a fresh clone following the README could not
# start the API, and tests/test_api.py silently skipped in CI as a result.
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13",
    # The maintenance copilot. Optional at runtime: with no credentials the
    # service falls back to a deterministic grounded drafter, so the feature
    # works for a reviewer who clones the repo without an API key.
    "anthropic>=0.40",
]
dev = [
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
railpoint = "pmdlib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/pmdlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ml", "backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml", "backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
