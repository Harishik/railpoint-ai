[project]
name = "railpoint-ai"
version = "0.1.0"
description = "AI-Based Failure Detection and Prediction for Railway Point Switch Machines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harishik Dev Singh Jamwal", email = "singhharishikdev@gmail.com" }]

dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "PyWavelets>=1.7,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.12,<1",
    "rich>=13",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "shap>=0.46",
    "mlflow>=2.16",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
railpoint = "pmdlib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/pmdlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ml", "backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml", "backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
