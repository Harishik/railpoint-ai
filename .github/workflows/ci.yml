name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev,ml]"

      - name: Lint
        run: .venv/bin/ruff check ml backend tests scripts

      - name: Types
        run: .venv/bin/mypy ml/pmdlib

      # The calibration gate is the credibility check for the whole project:
      # everything downstream trains on generated data, so the generator must be
      # shown to still match the real Sehwa traces. Those traces are private and
      # are not in this repository, so on a public runner the gate cannot run.
      # It says so, rather than reporting a pass it never earned.
      - name: Simulator calibration gate
        run: |
          if [ ! -f data/raw/sehwa/pmd_events.csv ]; then
            echo "::notice title=Calibration gate skipped::The private Sehwa extract is not present on this runner, so the simulator was not checked against the real traces. Run 'pytest tests/test_calibration.py' where the extract is available."
          fi
          .venv/bin/python -m pytest tests/test_calibration.py -q -rs

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q --maxfail=1

      # Proves the data pipeline and a training step actually run end to end,
      # rather than only that the modules import.
      - name: Training smoke run
        run: |
          .venv/bin/railpoint build-data --machines 6 --cycles 40 --replicates 1
          .venv/bin/python - <<'PY'
          import sys; sys.path.insert(0, 'ml')
          from pmdlib.train import TrainConfig, train
          model, info = train(TrainConfig(epochs=1, batch_size=64), verbose=True)
          assert model.n_parameters() > 0
          print('smoke ok, best macro-F1', info['best_macro_f1'])
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # `tsc --noEmit` against a solution-style tsconfig ("files": [], only
      # references) type-checks nothing and exits 0. `-b` builds the referenced
      # projects and is the only form that actually reports errors here.
      - run: npx tsc -b --force
      - run: npm run build
